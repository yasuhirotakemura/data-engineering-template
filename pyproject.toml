[tool.poetry]
name = "data-engineering-template"
version = "0.1.0"
description = "Data engineering starter"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
dbt-core = ">=1.10,<1.12"
dbt-duckdb = ">=1.9,<1.11"
duckdb = ">=1.2,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
ruff = ">=0.12,<1"
sqlfluff = ">=3,<5"
sqlfluff-templater-dbt = ">=3,<5"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
