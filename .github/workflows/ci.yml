name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install "poetry>=2.1,<3"
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Python lint
        run: poetry run ruff check python tests
      - name: Unit tests
        run: poetry run pytest -q
      - name: dbt build
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          cd dbt
          poetry run dbt build --profiles-dir .
      - name: Excel integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          files = list(Path("templates/excel").rglob("*.xlsx"))
          assert len(files) == 12, f"Expected 12 workbooks, got {len(files)}"
          for path in files:
              with ZipFile(path) as z:
                  assert z.testzip() is None
                  assert "[Content_Types].xml" in z.namelist()
          PY
